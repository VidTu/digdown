name: 'Build (Main)'
permissions: { }
concurrency:
  group: 'main'
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
jobs:
  main:
    name: 'Build (Main)'
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 15
    permissions:
      contents: 'write'
    env:
      GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
    steps:
      - name: 'Checkout'
        timeout-minutes: 1
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup JDK (25)'
        timeout-minutes: 1
        uses: 'actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6' # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25.0.4.1'
      - name: 'Setup Gradle'
        timeout-minutes: 5
        uses: 'gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6' # v6.4.0
        with:
          # Generate with either:
          # 1. Linux/macOS/Unix (OpenSSL): openssl rand -base64 32
          # 2. Linux/macOS/Unix: cat /dev/random | head -c32 | base64
          # 3. Windows (PowerShell): $bytes=New-Object byte[] 32;[Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes);[Convert]::ToBase64String($bytes)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph: 'generate-and-submit'
      - name: 'Build (Main)'
        timeout-minutes: 15
        run: './gradlew assemble'
      - name: 'Upload JAR'
        timeout-minutes: 1
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          path: 'build/libs/*.jar'
          if-no-files-found: 'error'
          archive: false
